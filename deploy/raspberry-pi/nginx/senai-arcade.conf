# SENAI Arcade — site estático servido apenas para a própria máquina (quiosque).
# Instalado em /etc/nginx/sites-available/senai-arcade pelo scripts/install.sh.

server {
    listen 127.0.0.1:80 default_server;
    listen [::1]:80 default_server;
    server_name localhost;

    # Release ativa (link simbólico trocado por scripts/deploy.sh e scripts/rollback.sh).
    root /opt/senai-arcade/current;
    index index.html;

    access_log off;
    error_log /var/log/nginx/senai-arcade.error.log warn;

    # Tudo local: nenhuma origem externa é permitida.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    # Launcher: não há rotas por URL; caminhos desconhecidos respondem 404.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'none'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Arquivos com hash no nome podem ficar em cache por muito tempo.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Catálogo sempre revalidado após uma atualização.
    location /catalog/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri =404;
    }
}
